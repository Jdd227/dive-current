name: Dive Current · NOAA data and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # SSCOFS cycles run 03,09,15,21 UTC, typically available about two hours later.
    - cron: '15 5,11,17,23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dive-current-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NOAA reader
        run: python -m pip install 'numpy>=1.26,<3' 'netCDF4>=1.7,<2'
      - name: Fetch NOAA CO-OPS tide predictions
        run: |
          python scripts/update_tides.py || echo 'NOAA tide API unavailable; retaining last verified cache.'
      - name: Process NOAA SSCOFS NetCDF forecast
        run: |
          python scripts/update_sscofs.py || echo 'NOAA SSCOFS processing unavailable; retaining previous data and its original timestamps.'
      - name: Validate static app and NOAA cache
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          node --check docs/dive-current.js
      - name: Commit validated NOAA data to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated NOAA tide and current snapshots [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
