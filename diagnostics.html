<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RunTime Dive Current | Diagnostics</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#111b20;color:#e9f6f5;max-width:840px;margin:40px auto;padding:0 20px}h1{font-size:26px}p{color:#bfd1d0}button{background:#274a45;color:#bbf6e6;border:1px solid #44857b;border-radius:8px;padding:10px 18px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid #334b4e;background:#16282c;border-radius:12px;padding:17px;line-height:1.8}img{max-width:100%;border:1px solid #364b4c;background:#31444c}small{color:#afc4c2}strong{color:#8ce0cc}</style></head><body>
<h1>RunTime Dive Current API diagnostics</h1>
<p>Tests local API connectivity without requiring the original Dive Current HTML or Leaflet. Does not certify NOAA or DNR availability.</p><button id="run">Run diagnostics</button><pre id="out">Select Run diagnostics.</pre><h2>DNR hillshade image (Puget Sound)</h2><img id="bathy" alt="DNR hillshade result (if upstream loads)"><p><small>This preview is a source test, not a navigational chart.</small></p>
<script>
const out=document.getElementById('out');const img=document.getElementById('bathy');
async function check(label,url){try{const r=await fetch(url,{cache:'no-store'});let sample=await r.text();return `${r.ok?'OK':'UNAVAILABLE'} ${label}: HTTP ${r.status} ${sample.slice(0,160)}`;}catch(e){return `ERROR ${label}: ${e.message}`}}
async function run(){out.textContent='Checking…';const bounds='west=-122.58&south=47.24&east=-122.45&north=47.34&width=900&height=550';const urls=[['Local server','/api/health'],['NOAA tide stations','/api/noaa/stations'],['SSCOFS vectors','/api/sscofs/info?time='+encodeURIComponent(new Date().toISOString())]];const results=[];for(const [name,url] of urls)results.push(await check(name,url));
try{const r=await fetch('/api/dnr/bathy?'+bounds);if(r.ok&&r.headers.get('content-type')?.startsWith('image/')){const b=await r.blob();img.src=URL.createObjectURL(b);results.push('OK DNR hillshade: image response received')}else{img.removeAttribute('src');results.push('UNAVAILABLE DNR hillshade: '+r.status+' '+(await r.text()).slice(0,200))}}catch(e){results.push('ERROR DNR hillshade: '+e.message)}
out.textContent=results.join('\n\n')}
document.getElementById('run').addEventListener('click',run);run();
</script></body></html>
